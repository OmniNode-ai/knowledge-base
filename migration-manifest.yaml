# OmniNode documentation migration manifest
#
# The single artifact that both the documentation migration and the CI drift
# guard read. The guard enforces a DECLARED mapping rather than inferring one
# from a document's shape, so that "where does this belong" is an explicit,
# auditable contract instead of a heuristic.
#
# Bucket definitions, the ordered decision rule, the pointer string, and the
# placeholder convention all live in docs-taxonomy.md. This file records
# decisions; it does not restate the rules behind them.
#
# STATE: migration in progress. omnibase_core carries the first real
# per-document `rows:` (4 rows, docs/decisions/ subset); every other repo is
# still at cutover_state: not-started with no `rows:` list, i.e. skeleton.
#
# ROW NESTING (drift-guard implementation decision, now exercised by
# omnibase_core's rows): a repository's per-document rows nest under that
# repository's entry in `repos:` as `rows: [<row_schema dict>, ...]` — see
# scripts/docs_drift_guard.py. This mirrors the existing per-repo nesting of
# bucket_a_candidates below rather than introducing a second top-level list.

schema_version: 1
status: migration-in-progress
default_destination_repo: knowledge-base

# ---------------------------------------------------------------------------
# Row schema — the shape every per-document row must take once migration begins
# ---------------------------------------------------------------------------

row_schema:
  source_path:
    required: true
    description: Repo-relative path of the original document.
  bucket:
    required: true
    one_of: [A, B, C, D]
    description: >-
      A = canonical, migrates to the knowledge base. B = repo-intrinsic, stays
      in the repo thinned with a pointer. C = restricted, never migrates to
      this public knowledge base — routes to a private, teammate-accessible
      internal documentation home instead (see open_decisions below). D =
      dated point-in-time artifact, stays put.
  destination:
    required: true
    description: >-
      Knowledge-base path for bucket A; the literal "stays-in-repo" for buckets
      B and D; the literal "private-internal-kb" for bucket C — the specific
      private repository is tracked internally, not named in this public repo
      (see open_decisions.restricted-content-home).
  owner:
    required: true
    description: >-
      Accountable person for the correctness of the migrated content. Not the
      person who runs the move — the person answerable for whether it is true.
  sensitivity:
    required: true
    one_of: [public, needs-review, restricted]
    description: >-
      Feeds the publication gate. A row may not move to a public destination
      while it is needs-review or restricted.
  correctness_status:
    required: true
    one_of: [current, stale, broken, hygiene-risk, placeholder]
    description: Assessed state, carried from the documentation catalog.
  verification_evidence:
    required: true
    description: >-
      What proved correctness_status — a file:line citation, a command that was
      run, or the literal "unverified — do not migrate". A row whose evidence
      is absent is not eligible to move, regardless of its assessed status.
  pointer_redirect:
    required: false
    description: >-
      The pointer line left behind in the thinned repo document, where one
      applies. Matched verbatim by the drift guard.
  max_lines:
    required: false
    description: >-
      Size budget for a bucket-B row, in lines of the thinned document
      (blank-line-inclusive, matching a plain line count of the file as
      checked out — not bytes, and not a delta against the row's value at
      cutover). Only meaningful for bucket B; absent means the drift guard
      does not size-check that row. Lines, not bytes, because a byte budget
      moves under line-ending/encoding changes that carry no content
      difference, and a delta-at-cutover budget would need a second stored
      baseline this schema does not otherwise carry. Enforced by the drift
      guard alongside pointer_redirect — see docs-taxonomy.md, "Bucket B".
  triage_verdict:
    required: false
    one_of:
      [
        MIGRATE_AS_IS,
        CORRECT_THEN_MIGRATE,
        GENERICIZE_THEN_MIGRATE,
        DELETE,
        FOLD,
        DO_NOT_MIGRATE,
      ]
    description: >-
      The correctness-and-scope verdict reached by reading the source document
      against the live code it describes, before anything moved. Optional
      because rows written before the triage-first rule existed do not carry
      one; required in practice for every row added under it. MIGRATE_AS_IS
      means the claims were checked and held. CORRECT_THEN_MIGRATE means
      drifted claims were found and fixed, with each fix verified against the
      code rather than merely made plausible. GENERICIZE_THEN_MIGRATE means an
      accurate procedure carried environment-specific values that were
      parameterized out and then re-read as an outsider would follow them.
      DELETE means the content was superseded, fabricated, or stale enough
      that publishing it would be worse than losing it. FOLD means an existing
      page already covers the substance, so destination names that page rather
      than a new one. DO_NOT_MIGRATE means the content may be correct but is
      out of scope for a public, self-hostable book — an operational journal,
      an evidence artifact, or deployment detail specific to one operator's
      own cloud.
  cutover_state:
    required: true
    one_of: [not-started, moved, pointer-live, verified-post-move, deleted]
    description: >-
      Progress of this row. Only verified-post-move means the move was checked
      after the fact rather than merely performed. `deleted` is the terminal
      state for a DELETE verdict — the source file was removed and no
      destination page exists, so the row records the judgment and its
      evidence rather than a move. Such a row's destination reads
      `deleted-not-migrated`, and it carries no pointer_redirect: a pointer to
      nothing is worse than no pointer.

# ---------------------------------------------------------------------------
# Migration preconditions — enforced per row, not per wave
# ---------------------------------------------------------------------------

preconditions:
  - id: scrubbed-before-move
    rule: >-
      A row with correctness_status hygiene-risk may not move until it is
      scrubbed and reassessed. Scrubbing is a precondition of migration.
  - id: broken-does-not-migrate-unchanged
    rule: >-
      A row with correctness_status broken must either be corrected inside its
      own migration change, or land in a non-indexed quarantine location, before
      it may appear in a generated index or a public entry point. Publishing a
      known-false document onto the authoritative surface is worse than leaving
      it scattered.
  - id: restricted-routes-to-private-kb
    rule: >-
      A row with sensitivity restricted never migrates to this public
      knowledge base. It is corrected/annotated in place or moved to the
      private, teammate-accessible internal documentation home tracked
      internally — see open_decisions.restricted-content-home (resolved).
  - id: tooling-prerequisite
    rule: >-
      No row may move into guides/, reference/, or runbooks/, or into any nested
      subdirectory, until the knowledge-base validation tooling recognizes those
      artifact classes and discovers files recursively. Until then such a
      document is unvalidated rather than invalid, which is the worse failure.

# ---------------------------------------------------------------------------
# Open decisions that block specific rows
# ---------------------------------------------------------------------------

open_decisions:
  - id: restricted-content-home
    blocks: rows with sensitivity restricted
    question: Where do documents that stay sensitive after scrubbing live?
    state: decided
    decision: >-
      A private, teammate-accessible internal documentation repository,
      separate from any individual's personal working repo. The specific
      repository name/URL is tracked internally, not recorded in this public
      repo, per the same "no private-repo references from public repos"
      principle this repo's own sanitization gate already enforces on commit
      messages, PR text, and artifact content.
  - id: publication-review-gate
    blocks: rows with sensitivity needs-review
    question: >-
      Is per-document sensitivity review with owner sign-off the gate for
      publication to the public knowledge base, replacing scrub-only?
    state: decided
    decision: >-
      No new per-document human review process. The migration only ever
      routes a row to this public knowledge base when it is classified
      sensitivity: public. Enforcement is mechanical: the existing fail-closed
      sanitization/scrub validation plus this manifest's sensitivity field. A
      row at needs-review or restricted is corrected in place, held, or routed
      to the private internal home (restricted-content-home, above) — it does
      not migrate here pending a review step.

# ---------------------------------------------------------------------------
# Per-repository mapping
#
# assessed / correctness counts come from the documentation catalog pass.
# bucket_a_candidates are directory-level candidates only; each expands into
# per-document rows during migration, at which point every row acquires its own
# owner, sensitivity, and verification_evidence.
#
# provenance: "catalog" = enumerated by the catalog pass. "not-enumerated" =
# this repository's canonical set was not broken out at the directory level
# yet, and is discovered during migration. An empty candidate list means
# not-yet-enumerated, never "nothing to move".
# ---------------------------------------------------------------------------

