# ---------------------------------------------------------------------------
# Cross-repository reconciliations that land as canonical content
# ---------------------------------------------------------------------------

registry_reconciliation:
  problem: >-
    Three surfaces independently list the organization's repositories and all
    three disagree — the organization profile table, the installer manifest, and
    the flagship README's inclusion table. Each was hand-maintained, so each
    drifted separately.
  resolution: >-
    Pick the installer manifest as the single canonical registry, since it is
    the one machine-read surface. Derive both the knowledge-base registry page
    and the organization profile table from it. Private repositories are
    annotated (name + one-line purpose, no clone URL) rather than silently
    omitted or silently exposed as public.
  destination: reference/
  destination_file: reference/repository-registry.md
  cutover_state: moved
  resolved_note: >-
    Landed reference/repository-registry.md, generated from
    omnibase/repos.yaml (10 platform-component rows as of this cutover) plus
    a supplementary "other public repositories" section (omnibase itself,
    knowledge-base, omnigemini) and a "private repositories" section
    (omninode_infra, omniweb — annotated, no URL). OmniNode-ai/.github
    profile/README.md's Core Repositories table was regenerated from the
    same rows in the same change, replacing its independently-maintained
    descriptions.

shared_layout_template:
  problem: >-
    A shared standard document layout template was copied into multiple
    repositories and the copies diverged.
  resolution: >-
    Reconcile to one canonical template here; repositories point at it rather
    than carrying a copy.
  destination: reference/standard-doc-layout.md
  cutover_state: moved
  notes: >-
    2026-08-25 (Wave-2 item C7): reconciled four independently-
    diverged copies (omniclaude, omnibase_core, omnibase_infra,
    omniintelligence) into the single reference/standard-doc-layout.md.
    Each source repo's docs/standards/STANDARD_DOC_LAYOUT.md is thinned to a
    pointer stub at that path (per-repo rows above under each repo's `rows:`
    list carry the individual verification evidence).

