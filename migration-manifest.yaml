# OmniNode documentation migration manifest
#
# The single artifact that both the documentation migration and the CI drift
# guard read. The guard enforces a DECLARED mapping rather than inferring one
# from a document's shape, so that "where does this belong" is an explicit,
# auditable contract instead of a heuristic.
#
# Bucket definitions, the ordered decision rule, the pointer string, and the
# placeholder convention all live in docs-taxonomy.md. This file records
# decisions; it does not restate the rules behind them.
#
# STATE: skeleton. Per-repository mappings only. Per-document rows are produced
# during migration. Every repository is at cutover_state: not-started, and no
# content has moved.

schema_version: 1
status: skeleton
default_destination_repo: knowledge-base

# ---------------------------------------------------------------------------
# Row schema — the shape every per-document row must take once migration begins
# ---------------------------------------------------------------------------

row_schema:
  source_path:
    required: true
    description: Repo-relative path of the original document.
  bucket:
    required: true
    one_of: [A, B, C, D]
    description: >-
      A = canonical, migrates to the knowledge base. B = repo-intrinsic, stays
      in the repo thinned with a pointer. C = restricted, publication blocked
      pending the open decisions. D = dated point-in-time artifact, stays put.
  destination:
    required: true
    description: >-
      Knowledge-base path for bucket A; the literal "stays-in-repo" for buckets
      B and D; "restricted-home-undecided" for bucket C.
  owner:
    required: true
    description: >-
      Accountable person for the correctness of the migrated content. Not the
      person who runs the move — the person answerable for whether it is true.
  sensitivity:
    required: true
    one_of: [public, needs-review, restricted]
    description: >-
      Feeds the publication gate. A row may not move to a public destination
      while it is needs-review or restricted.
  correctness_status:
    required: true
    one_of: [current, stale, broken, hygiene-risk, placeholder]
    description: Assessed state, carried from the documentation catalog.
  verification_evidence:
    required: true
    description: >-
      What proved correctness_status — a file:line citation, a command that was
      run, or the literal "unverified — do not migrate". A row whose evidence
      is absent is not eligible to move, regardless of its assessed status.
  pointer_redirect:
    required: false
    description: >-
      The pointer line left behind in the thinned repo document, where one
      applies. Matched verbatim by the drift guard.
  cutover_state:
    required: true
    one_of: [not-started, moved, pointer-live, verified-post-move]
    description: >-
      Progress of this row. Only verified-post-move means the move was checked
      after the fact rather than merely performed.

# ---------------------------------------------------------------------------
# Migration preconditions — enforced per row, not per wave
# ---------------------------------------------------------------------------

preconditions:
  - id: scrubbed-before-move
    rule: >-
      A row with correctness_status hygiene-risk may not move until it is
      scrubbed and reassessed. Scrubbing is a precondition of migration.
  - id: broken-does-not-migrate-unchanged
    rule: >-
      A row with correctness_status broken must either be corrected inside its
      own migration change, or land in a non-indexed quarantine location, before
      it may appear in a generated index or a public entry point. Publishing a
      known-false document onto the authoritative surface is worse than leaving
      it scattered.
  - id: restricted-is-blocked-not-routed
    rule: >-
      A row with sensitivity restricted stays put until the restricted-content
      home and the publication-review gate are both decided.
  - id: tooling-prerequisite
    rule: >-
      No row may move into guides/, reference/, or runbooks/, or into any nested
      subdirectory, until the knowledge-base validation tooling recognizes those
      artifact classes and discovers files recursively. Until then such a
      document is unvalidated rather than invalid, which is the worse failure.

# ---------------------------------------------------------------------------
# Open decisions that block specific rows
# ---------------------------------------------------------------------------

open_decisions:
  - id: restricted-content-home
    blocks: rows with sensitivity restricted
    question: Where do documents that stay sensitive after scrubbing live?
    state: undecided
  - id: publication-review-gate
    blocks: rows with sensitivity needs-review
    question: >-
      Is per-document sensitivity review with owner sign-off the gate for
      publication to the public knowledge base, replacing scrub-only?
    state: undecided

# ---------------------------------------------------------------------------
# Per-repository mapping
#
# assessed / correctness counts come from the documentation catalog pass.
# bucket_a_candidates are directory-level candidates only; each expands into
# per-document rows during migration, at which point every row acquires its own
# owner, sensitivity, and verification_evidence.
#
# provenance: "catalog" = enumerated by the catalog pass. "not-enumerated" =
# this repository's canonical set was not broken out at the directory level
# yet, and is discovered during migration. An empty candidate list means
# not-yet-enumerated, never "nothing to move".
# ---------------------------------------------------------------------------

