<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" role="img" aria-labelledby="onb-title onb-desc">
  <title id="onb-title">OmniNode</title>
  <desc id="onb-desc">Deterministic infrastructure for autonomous systems</desc>
  <defs>
    <linearGradient id="onb-bg" x1="0" y1="0" x2="1280" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#151D30"/>
    </linearGradient>
    <linearGradient id="onb-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- theme-neutral: opaque background panel reads identically on GitHub light and dark -->
  <rect width="1280" height="220" fill="url(#onb-bg)"/>
  <rect width="1280" height="220" fill="none" stroke="#232C42" stroke-width="1"/>

  <!-- quiet geometric node mark: three linked points, not clip-art -->
  <g transform="translate(88,110)" stroke="url(#onb-accent)" stroke-width="2" fill="none" opacity="0.9">
    <line x1="-22" y1="14" x2="0" y2="-16"/>
    <line x1="0" y1="-16" x2="22" y2="14"/>
    <line x1="-22" y1="14" x2="22" y2="14"/>
  </g>
  <g transform="translate(88,110)" fill="url(#onb-accent)">
    <circle cx="-22" cy="14" r="5.5"/>
    <circle cx="22" cy="14" r="5.5"/>
    <circle cx="0" cy="-16" r="5.5"/>
  </g>

  <text x="150" y="130"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="-1" fill="#F3F5F9">Omni<tspan fill="#5EEAD4">Node</tspan></text>

  <text x="152" y="166"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="500" letter-spacing="3" fill="#8A96AE">DETERMINISTIC INFRASTRUCTURE FOR AUTONOMOUS SYSTEMS</text>
</svg>
